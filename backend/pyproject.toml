[project]
name = "trading-demo-backend"
version = "0.1.0"
description = "Simulated trading dashboard API: factor-model prices, scenarios and a typed HTTP contract."
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
